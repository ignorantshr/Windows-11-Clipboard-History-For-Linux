name: Release

# Fork-specific release workflow.
# - Push a tag like `v0.7.2` -> builds packages and publishes a GitHub Release in this repo.
# - Run manually from the Actions tab -> only builds packages (downloadable as artifacts), no Release.
# Upstream's Cloudsmith (APT/DNF repo) and AUR publishing steps are intentionally removed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build against Ubuntu 22.04's glibc baseline for older desktops.
          - arch: x86_64
            runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            # Manual run: keep the version already in package.json
            echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.runner }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Update version files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          echo "Syncing version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json
          sed -i '0,/^version = "[^"]*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          echo "=== Versions after sync ==="
          echo "package.json: $(grep '"version"' package.json | head -1)"
          echo "tauri.conf.json: $(grep '"version"' src-tauri/tauri.conf.json | head -1)"
          echo "Cargo.toml: $(grep '^version' src-tauri/Cargo.toml | head -1)"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 7

  release:
    name: Create Release
    needs: build
    # Only publish a Release for tag pushes; manual runs stop after building.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec sha256sum {} + | sed 's|  \./.*/|  |; s|  \./|  |' > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/SHA256SUMS
          body: |
            # W11 Clipboard For Linux ${{ github.ref_name }}

            Fork build from [${{ github.repository }}](https://github.com/${{ github.repository }}), based on [gustavosett/Windows-11-Clipboard-History-For-Linux](https://github.com/gustavosett/Windows-11-Clipboard-History-For-Linux).

            Download the package for your architecture from the assets below and verify it with `sha256sum -c SHA256SUMS --ignore-missing`.

            > If the upstream APT/DNF repository or AUR package is installed, remove it first, otherwise system updates may replace this build with the upstream version.

            ---

            ### 📦 Installation

            <details>
            <summary>Ubuntu/Debian (.deb)</summary>

            amd64 for x86_64, arm64 for ARM64:
            ```bash
            sudo apt install ./win11-clipboard-history_${{ steps.get_version.outputs.VERSION }}_amd64.deb
            sudo setfacl -m u:$USER:rw /dev/uinput  # For immediate paste access
            ```
            </details>

            <details>
            <summary>Fedora/RHEL (.rpm)</summary>

            x86_64 for Intel/AMD, aarch64 for ARM64:
            ```bash
            sudo dnf install ./win11-clipboard-history-${{ steps.get_version.outputs.VERSION }}-1.x86_64.rpm
            sudo setfacl -m u:$USER:rw /dev/uinput  # For immediate paste access
            ```
            </details>

            <details>
            <summary>AppImage (Universal - any distro)</summary>

            > Some features are disabled; the .deb/.rpm installation is recommended.
            ```bash
            chmod +x win11-clipboard-history_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage
            sudo setfacl -m u:$USER:rw /dev/uinput  # Required for paste simulation
            ./win11-clipboard-history_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage
            ```
            Then register a system shortcut (e.g. Super+V) that runs the AppImage.

            > **Note:** `setfacl` is temporary (resets on reboot). For permanent setup, see the [README](https://github.com/${{ github.repository }}#appimage-universal).
            </details>

            ---

            ### ⌨️ Usage

            Press **Super+V** to open the clipboard history. The app will show a Setup Wizard on first run to configure shortcuts and permissions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
